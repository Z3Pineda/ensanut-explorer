name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Verify data artifacts
        run: |
          test -f docs/data/manifest.json
          test -f docs/data/lactancia/2021/meta.json
          python -c "import json; json.load(open('catalog.json'))"

      - name: Run pytest
        run: |
          python -c "import prepare_data; import tests.helpers"
          python -m pytest tests/ -q --tb=short --ignore=tests/test_reproduction.py
